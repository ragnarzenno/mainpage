<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Dash V3 · Мотивация</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08070a;--gold:#d3ac68;--gold-br:#f4d089;--ink:#f4f7fb;--dim:#9aa2b0;--acc:#8fd07a;--minus:#e78a63;--line:rgba(211,172,104,.24)}
*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,sans-serif;overflow:hidden}
.hero-bg{position:fixed;inset:0;z-index:0;background:#000 center/cover no-repeat;background-image:url('/sistema/bestiary-img/me.jpg');background-position:78% 18%;filter:saturate(.9)}
.scrim{position:fixed;inset:0;z-index:0;background:linear-gradient(90deg,rgba(6,5,7,.97) 0%,rgba(6,5,7,.9) 46%,rgba(6,5,7,.55) 74%,rgba(6,5,7,.75) 100%)}
.wrap{position:relative;z-index:1;width:1024px;height:768px;margin:0 auto;padding:28px 40px;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:auto}
.hd .ru{font-family:Cinzel;font-size:20px;color:var(--gold)}.hd .t{font-family:Cinzel;font-weight:800;font-size:16px;letter-spacing:2px;color:var(--gold-br)}
.hd .sp{flex:1}.hd .clk{font-size:14px;color:#cfd6e0;font-weight:700}
.goalhead{font-family:Cinzel;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.dest{font-family:Cinzel;font-weight:900;font-size:56px;color:var(--gold-br);line-height:1;letter-spacing:1px;text-shadow:0 0 40px rgba(211,172,104,.35)}
.dest small{font-size:22px;color:var(--dim);font-weight:700;letter-spacing:1px}
.prog{margin:18px 0 4px;max-width:720px}
.pnum{display:flex;align-items:baseline;gap:12px}
.pnum .big{font-size:40px;font-weight:900;color:#fff}.pnum .of{font-size:20px;color:var(--dim);font-weight:700}
.bar{height:20px;border-radius:11px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:12px;border:1px solid rgba(211,172,104,.18);max-width:720px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a2f,var(--gold-br));border-radius:11px;box-shadow:0 0 18px rgba(240,208,137,.4)}
.pline{display:flex;gap:26px;margin-top:12px;font-size:16px;color:var(--dim);font-weight:600}
.pline b{color:var(--gold-br)}
.momentum{margin-top:22px;font-size:19px;font-weight:700;color:var(--ink)}
.momentum .fire{color:#f0a04e}.momentum .up{color:var(--acc)}
.mini{display:flex;gap:14px;margin-top:22px}
.m{border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:rgba(14,11,7,.55);min-width:130px}
.m .l{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);font-weight:700}
.m .v{font-size:24px;font-weight:900;margin-top:3px;color:var(--gold-br)}.m.mn .v{color:var(--minus)}
.quote{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;font-size:22px;font-weight:800;color:#fff;max-width:820px;line-height:1.25}
.quote b{color:var(--gold-br)}
</style></head><body>
<div class="hero-bg"></div><div class="scrim"></div>
<div class="wrap">
  <div class="hd"><span class="ru">ᚱ</span><span class="t">ПУТЬ РАГНАРРА · ДЕНЬГИ</span><span class="sp"></span><span class="clk" id="clk"></span></div>
  <div class="goalhead">Курс на</div>
  <div class="dest">БАЛИ <small>347 000 ₽ / мес</small></div>
  <div class="prog">
    <div class="pnum"><span class="big">87 500 ₽</span><span class="of">/ 347 000 ₽ в этом месяце</span></div>
    <div class="bar"><i style="width:25%"></i></div>
    <div class="pline"><span><b>25%</b> пути</span><span>осталось <b>259 500 ₽</b></span><span>нужно <b>17 300 ₽/день</b></span></div>
  </div>
  <div class="momentum"><span class="fire">🔥 12 дней подряд</span> · сегодня <span class="up">+5 000 ₽</span> · темп растёт ↗</div>
  <div class="mini">
    <div class="m"><div class="l">Сегодня</div><div class="v">5 000</div></div>
    <div class="m"><div class="l">Баланс</div><div class="v">43 000</div></div>
    <div class="m mn"><div class="l">Долг</div><div class="v">222 000</div></div>
    <div class="m"><div class="l">Сейф</div><div class="v">15 000</div></div>
  </div>
  <div class="quote">«Я возвращаю людям их душу. <b>Деньги идут за силой.</b>»</div>
</div>
<script>function p(n){return(n<10?'0':'')+n}function ck(){var d=new Date();document.getElementById('clk').textContent=p(d.getDate())+'.'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())}ck();setInterval(ck,1000);</script>
</body></html>
