<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><title>Путь Рагнарра · Доход по дням</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Доход по дням">
<meta name="viewport" content="width=1024,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<style>
/* iPad 3 / iOS 9: без CSS Grid и flex-gap. Абсолютное позиционирование в 1024x768. */
:root{--gold:#d3ac68;--gold-br:#f4d089;--ink:#f4f7fb;--dim:#9aa2b0;--acc:#8fd07a;--line:rgba(211,172,104,.24);--soft:rgba(211,172,104,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1024px;height:768px;background:#070605;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
.wrap{position:relative;width:1024px;height:768px;overflow:hidden}
.bg{position:absolute;top:0;left:0;width:1024px;height:768px;background:#000 no-repeat;background-image:url('me.jpg');background-size:cover;background-position:82% 14%}
.scrim{position:absolute;top:0;left:0;width:1024px;height:768px;background:linear-gradient(90deg,rgba(6,5,7,.97) 0%,rgba(6,5,7,.93) 52%,rgba(6,5,7,.75) 100%)}
.hd{position:absolute;top:18px;left:30px;width:964px;height:26px}
.hd .ru{font-family:Georgia,serif;font-size:20px;color:var(--gold);vertical-align:middle}
.hd .t{font-weight:800;font-size:15px;letter-spacing:2px;color:var(--gold-br);vertical-align:middle;margin-left:8px}
.hd .clk{float:right;font-size:14px;color:#cfd6e0;font-weight:700;margin-top:4px}
.st{position:absolute;top:56px;height:70px;width:232px;border:1px solid var(--soft);border-radius:11px;background:rgba(14,11,7,.62);padding:11px 15px}
.st .l{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);font-weight:700}
.st .v{font-size:25px;font-weight:900;margin-top:4px;color:var(--gold-br);white-space:nowrap}
.st.tot .v{color:var(--acc)}
.card{position:absolute;border:1px solid var(--line);border-radius:14px;background:rgba(12,10,8,.6)}
.chartCard{top:142px;left:30px;width:614px;height:598px}
.tableCard{top:142px;left:660px;width:334px;height:598px}
.pt{position:absolute;top:14px;left:18px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800}
.chartWrap{position:absolute;top:46px;left:14px;right:14px;bottom:34px}
svg{width:100%;height:100%;display:block}
.sync{position:absolute;bottom:10px;left:18px;font-size:11px;color:var(--dim)}
.tblWrap{position:absolute;top:46px;left:16px;right:16px;bottom:82px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid rgba(255,255,255,.08);padding:7px 6px;text-align:left}
th{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
td.sum{color:var(--gold-br);font-weight:800;text-align:right}
.navbtn{position:absolute;bottom:14px;left:16px;right:16px;height:50px;border:2px solid rgba(211,172,104,.42);border-radius:12px;background:linear-gradient(180deg,rgba(233,205,143,.24),rgba(209,177,106,.08));color:#fff;font-size:22px;font-weight:900;-webkit-appearance:none;appearance:none}
</style></head><body>
<div class="wrap">
  <div class="bg"></div><div class="scrim"></div>
  <div class="hd"><span class="t">Доход по дням</span><span class="clk" id="clk"></span></div>
  <div class="st" style="left:30px"><div class="l">Сегодня</div><div class="v" id="income_today">—</div></div>
  <div class="st" style="left:274px"><div class="l">Вчера</div><div class="v" id="income_yesterday">—</div></div>
  <div class="st" style="left:518px"><div class="l">Месяц</div><div class="v" id="income_month">—</div></div>
  <div class="st tot" style="left:762px"><div class="l">Всего</div><div class="v" id="income_total">—</div></div>
  <div class="card chartCard">
    <div class="pt">График дохода</div>
    <div class="chartWrap"><svg id="chart" viewBox="0 0 900 520" preserveAspectRatio="none"></svg></div>
    <div class="sync" id="sync">Загрузка…</div>
  </div>
  <div class="card tableCard">
    <div class="pt">Таблица заработка</div>
    <div class="tblWrap"><table><thead><tr><th>Дата</th><th style="text-align:right">Сумма</th></tr></thead><tbody id="tbody"></tbody></table></div>
    <button class="navbtn" type="button" onclick="window.location.href='index.html'">← назад</button>
  </div>
</div>
<script>
var GAS="https://script.google.com/macros/s/AKfycbwI-yuwuNLx0mFVocA43t_N1CKe7I1-yVRd1d2PVVhoQqZNyQT8zCa_G-m9UaVQHrFPZA/exec";
var REFRESH=30000,IDR_RUB=0.004315,GOAL_MONTH=347000,NS="http://www.w3.org/2000/svg";
function p2(n){return(n<10?"0":"")+n}
function clk(){var d=new Date();document.getElementById("clk").innerHTML=p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
clk();setInterval(clk,1000);
function grp(n){n=Math.round(n);var neg=n<0;n=Math.abs(n);var s=""+n,o="";for(var i=0;i<s.length;i++){if(i>0&&(s.length-i)%3===0)o+=" ";o+=s.charAt(i);}return(neg?"-":"")+o;}
function parseNum(v){if(v==null)return null;var raw=(""+v).replace(/ /g," ").replace(/ /g," ").trim();if(!raw)return null;var np=raw.replace(/[^0-9,\.\-]/g,"");if(!np)return null;np=np.replace(/\s+/g,"").replace(/,/g,".");var fd=np.indexOf(".");if(fd!==-1)np=np.slice(0,fd+1)+np.slice(fd+1).replace(/\./g,"");var n=parseFloat(np);return isNaN(n)?null:n;}
function curOf(v){var s=""+v;if(/rp|idr|рупи/i.test(s))return"IDR";if(/\$|usd/i.test(s))return"USD";return"RUB";}
function money(v){var n=parseNum(v);if(n==null)return"—";var c=curOf(v);if(c==="IDR")return grp(n)+" Rp";if(c==="USD")return "$"+grp(n);return grp(n)+" &#8381;";}
function setM(id,v){var e=document.getElementById(id);if(e)e.innerHTML=money(v);}
function el(n){return document.createElementNS(NS,n);}
function txt(x,y,s,fill,anchor,size){var t=el("text");t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("fill",fill);t.setAttribute("font-size",size||14);t.setAttribute("font-weight","700");t.setAttribute("font-family","-apple-system,Arial,sans-serif");if(anchor)t.setAttribute("text-anchor",anchor);t.appendChild(document.createTextNode(s));return t;}
function rect_(x,y,w,h,rx,fill){var r=el("rect");r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);r.setAttribute("rx",rx);r.setAttribute("fill",fill);return r;}
function drawChart(points){
  var svg=document.getElementById("chart");svg.innerHTML="";
  if(!points||!points.length){svg.appendChild(txt(450,260,"Нет данных","#7f8a99","middle",22));return;}
  var W=900,H=520,L=86,R=26,T=36,B=60,n=points.length,vals=[],i;
  for(i=0;i<n;i++){var m=parseNum(points[i].value);vals.push(m==null?0:m);}
  var d=new Date(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  var targetDay=Math.round(GOAL_MONTH/dim);
  var mx=Math.max.apply(null,vals);if(mx<targetDay)mx=targetDay;if(mx<=0)mx=1;mx=mx*1.14;
  function Y(v){return T+(H-T-B)*(1-v/mx);}
  var baseY=Y(0),step=(W-L-R)/n,bw=Math.min(48,step*0.58),labStep=Math.ceil(n/13);
  var defs=el("defs"),lg=el("linearGradient");lg.setAttribute("id","barg");lg.setAttribute("x1","0");lg.setAttribute("y1","0");lg.setAttribute("x2","0");lg.setAttribute("y2","1");
  var a1=el("stop");a1.setAttribute("offset","0");a1.setAttribute("stop-color","#f6d492");var a2=el("stop");a2.setAttribute("offset","1");a2.setAttribute("stop-color","#8a6a2f");
  lg.appendChild(a1);lg.appendChild(a2);defs.appendChild(lg);svg.appendChild(defs);
  for(i=0;i<=4;i++){var gv=mx*(i/4),gy=Y(gv);var ln=el("line");ln.setAttribute("x1",L);ln.setAttribute("x2",W-R);ln.setAttribute("y1",gy);ln.setAttribute("y2",gy);ln.setAttribute("stroke","rgba(255,255,255,.07)");svg.appendChild(ln);svg.appendChild(txt(L-10,gy+5,grp(gv),"#8b95a6","end",13));}
  for(i=0;i<n;i++){
    var cx=L+step*(i+0.5),v=vals[i],bx=cx-bw/2;
    var isToday=(""+(points[i].label||"")).indexOf(p2(d.getDate())+"."+p2(d.getMonth()+1))===0;
    if(v>0){var by=Y(v),bh=Math.max(2,baseY-by);var r=rect_(bx,by,bw,bh,6,"url(#barg)");if(isToday){r.setAttribute("stroke","#fff");r.setAttribute("stroke-width","2.5");}svg.appendChild(r);
      if(n<=16)svg.appendChild(txt(cx,Math.max(T+14,by-8),grp(v),"#f4d089","middle",14));}
    else{svg.appendChild(rect_(bx,baseY-3,bw,3,1.5,"rgba(211,172,104,.32)"));}
    if(i%labStep===0||isToday){var lab=(points[i].label||"");if(lab.length>=5)lab=lab.substring(0,5);svg.appendChild(txt(cx,H-18,lab,isToday?"#f4d089":"#9aa7b8","middle",13));}
  }
  var ty=Y(targetDay),tl=el("line");tl.setAttribute("x1",L);tl.setAttribute("x2",W-R);tl.setAttribute("y1",ty);tl.setAttribute("y2",ty);tl.setAttribute("stroke","#8fd07a");tl.setAttribute("stroke-width","2");tl.setAttribute("stroke-dasharray","7 6");tl.setAttribute("opacity",".75");svg.appendChild(tl);
  svg.appendChild(txt(W-R,ty-8,"цель ~ "+grp(targetDay)+" в день","#8fd07a","end",13));
}
function renderTable(points){var tb=document.getElementById("tbody");tb.innerHTML="";if(!points||!points.length){var tr=document.createElement("tr");tr.innerHTML="<td>—</td><td class='sum'>—</td>";tb.appendChild(tr);return;}var start=points.length>16?points.length-16:0;for(var i=start;i<points.length;i++){var tr=document.createElement("tr");tr.innerHTML="<td>"+(points[i].label||"—")+"</td><td class='sum'>"+money(points[i].value)+"</td>";tb.appendChild(tr);}}
function renderIncome(d){var pts=d.chart_points||[];setM("income_today",d.income_today);setM("income_yesterday",d.income_yesterday);setM("income_month",d.income_month);
  var tot=0,i;for(i=0;i<pts.length;i++){var n=parseNum(pts[i].value);if(n)tot+=n;}setM("income_total",tot);
  renderTable(pts);drawChart(pts);document.getElementById("sync").innerHTML=d.updated_at?("Обновлено: "+d.updated_at):"OK";}
function load(){var id="js1",old=document.getElementById(id);if(old&&old.parentNode)old.parentNode.removeChild(old);var s=document.createElement("script");s.id=id;s.src=GAS+"?callback=renderIncome&page=income&_="+(new Date().getTime());s.onerror=function(){document.getElementById("sync").innerHTML="Ошибка загрузки";};document.body.appendChild(s);}
load();setInterval(load,REFRESH);
</script></body></html>
