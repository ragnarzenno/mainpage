# ndppd — нужен ТОЛЬКО для on-link префиксов, где апстрим шлёт
# neighbor solicitation и ждёт ответа за каждый адрес.
# Если префикс маршрутизирован статически (routed) — ndppd НЕ нужен,
# достаточно AnyIP: ip -6 route add local <prefix> dev lo
#
# Проверка: `ip -6 route show <prefix>` у апстрима.
#   via <ваш адрес> = routed  -> AnyIP
#   dev <iface>     = on-link -> ndppd

route-ttl 30000

proxy eth0 {
   router yes
   timeout 500
   ttl 30000

   # static — отвечать на ВСЕ адреса диапазона не проверяя, есть ли они локально.
   # На больших префиксах это единственный рабочий режим: auto проверяет
   # таблицу маршрутов на каждый запрос и на десятках тысяч адресов душит CPU.
   rule 2a01:4f8:aaaa:bbbb::/64 {
      static
   }
}
