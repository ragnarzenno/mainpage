# BIRD 2.x — анонс собственного или арендованного IPv6-префикса
# на хостере с поддержкой BYOIP (Vultr, iFog, BuyVM, Combahton, Latitude...).
#
# Что нужно до этого:
#   1. ASN (свой или предоставленный хостером private ASN для сессии)
#   2. route6-объект в RIPE DB: route6: 2a0e:1234::/48, origin: ASxxxxx
#   3. ROA (RPKI) на префикс — без него половина транзитов дропнет анонс
#   4. LOA от владельца префикса, если он арендован
#   5. Тикет хостеру на онбординг префикса (Vultr: 24-48 часов)
#
# Анонсировать можно не короче /48 — более длинные префиксы глобально
# фильтруются. То есть /29 нарезается на /48 и раскладывается по локациям.

define OUR_ASN   = 4242420000;      # ваш ASN
define OUR_NET6  = 2a0e:1234:5678::/48;
define LOCAL_IP6 = 2001:19f0:ffff::1;   # адрес вашего конца сессии (даёт хостер)
define PEER_IP6  = 2001:19f0:ffff::2;   # адрес BGP-пира хостера
define PEER_ASN  = 64515;               # ASN пира (Vultr: 64515)
define PEER_PASS = "bgp-md5-password";  # пароль сессии из панели хостера

router id 10.0.0.1;
log syslog all;

protocol device { scan time 10; }

protocol direct {
    ipv6;
    interface "lo", "dummy*";
}

protocol kernel {
    ipv6 {
        import none;
        export filter {
            # в ядро отдаём только маршруты, полученные по BGP
            if source = RTS_STATIC then reject;
            accept;
        };
    };
    learn;
}

# Статический маршрут, который и будет анонсироваться.
# blackhole нужен, чтобы префикс существовал в таблице даже когда
# ни один адрес из него не активен — иначе анонс пропадёт.
protocol static static_v6 {
    ipv6;
    route OUR_NET6 blackhole;
}

protocol bgp vultr6 {
    description "Upstream BGP session";
    local as OUR_ASN;
    source address LOCAL_IP6;
    neighbor PEER_IP6 as PEER_ASN;
    password PEER_PASS;
    multihop 2;                     # Vultr требует multihop
    graceful restart on;

    ipv6 {
        import none;                # full table нам не нужен, дефолт есть в ядре
        export filter {
            # анонсируем СТРОГО свой префикс. Ошибка тут = утечка чужих
            # маршрутов и блокировка BGP-доступа хостером.
            if net = OUR_NET6 then accept;
            reject;
        };
        import limit 100 action block;
    };
}

# Проверка после запуска:
#   birdc show protocols all vultr6
#   birdc show route export vultr6
#   затем внешне: https://bgp.tools/prefix/<ваш /48>  и  https://stat.ripe.net/
