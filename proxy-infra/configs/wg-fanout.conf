# WireGuard-фанаут: один купленный /48 раскидывается кусками по /56
# на дешёвые фронты в разных гео. Адреса при этом ПОСТОЯННЫЕ, а серверы —
# одноразовые: при бане или закрытии хостера /56 переезжает на новый фронт
# за минуту, клиентские списки прокси не меняются.
#
#   [Бэкенд с /48] ──wg0──▶ фронт NL  2a0e:1234:5678:0100::/56
#                  ──wg0──▶ фронт SG  2a0e:1234:5678:0200::/56
#                  ──wg0──▶ фронт BR  2a0e:1234:5678:0300::/56
#
# На бэкенде обязательно: net.ipv6.conf.all.forwarding=1
# и маршрут всего /48 через сам бэкенд (BGP-анонс или статика от хостера).

# ============================ БЭКЕНД (/etc/wireguard/wg0.conf) =============
[Interface]
Address    = fd00:wg::1/64
ListenPort = 51820
PrivateKey = <BACKEND_PRIVKEY>
MTU        = 1420
# forwarding + AnyIP на остаток /48, который не роздан фронтам
PostUp   = sysctl -qw net.ipv6.conf.all.forwarding=1
PostUp   = ip -6 route replace local 2a0e:1234:5678::/56 dev lo
PostUp   = ip6tables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu
PostDown = ip6tables -t mangle -D FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu

[Peer]
# фронт NL
PublicKey  = <FRONT_NL_PUBKEY>
AllowedIPs = fd00:wg::2/128, 2a0e:1234:5678:0100::/56

[Peer]
# фронт SG
PublicKey  = <FRONT_SG_PUBKEY>
AllowedIPs = fd00:wg::3/128, 2a0e:1234:5678:0200::/56

[Peer]
# фронт BR
PublicKey  = <FRONT_BR_PUBKEY>
AllowedIPs = fd00:wg::4/128, 2a0e:1234:5678:0300::/56


# ============================ ФРОНТ NL (/etc/wireguard/wg0.conf) ===========
# Фронт может быть каким угодно дешёвым IPv4-only VPS за $1 —
# собственный IPv6 ему не нужен вообще.
#
# [Interface]
# Address    = fd00:wg::2/128
# PrivateKey = <FRONT_NL_PRIVKEY>
# MTU        = 1420
# Table      = off
# PostUp = sysctl -qw net.ipv6.ip_nonlocal_bind=1
# PostUp = sysctl -qw net.ipv6.conf.all.forwarding=1
# # весь свой /56 вешаем локально через AnyIP — прокси биндит любой адрес из него
# PostUp = ip -6 route replace local 2a0e:1234:5678:0100::/56 dev lo
# # весь исходящий IPv6 гоним в туннель
# PostUp = ip -6 route replace default dev wg0
#
# [Peer]
# PublicKey  = <BACKEND_PUBKEY>
# Endpoint   = <BACKEND_IPV4>:51820
# AllowedIPs = ::/0
# PersistentKeepalive = 25
#
# Далее на фронте:
#   ./setup-ipv6-proxy.sh --prefix 2a0e:1234:5678:0100::/56 --count 5000 --mode anyip
